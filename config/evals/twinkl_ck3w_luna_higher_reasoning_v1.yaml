  full_run_contingency: 1.20

protocol_amendment:
  amended_at: '2026-08-09'
  initial_max_output_tokens: 2000
  amended_max_output_tokens: 8000
  xhigh_final_max_output_tokens: 32000
  initial_client_concurrency: 4
  intermediate_client_concurrency: 12
  final_client_concurrency: 24
  reason: >-
    The length-stratified smoke tests passed at 2,000 tokens, but the full runs
    produced incomplete max_output_tokens responses. The higher ceiling avoids
    measuring truncation instead of reasoning effort.
  xhigh_reason: >-
    Two xhigh continuation calls reached 8,000 output tokens. The xhigh-only
    ceiling increased to 32,000. Medium and high remain at 8,000.
  continuation_rule: >-
    Preserve every initial receipt. Reuse only completed valid or fail-closed
    receipts. Retry incomplete and non-terminal error receipts at the amended
    ceiling.
  concurrency_note: >-
    Client concurrency changed after valid continuation receipts showed long
    xhigh wall time. It moved from 4 to 12 and then 24. This changes call
    scheduling only. Latency remains a diagnostic and is not directly
    comparable with Luna low.
  execution_note: >-
    The initial executor waited for each complete batch. The final executor
    uses a continuous 24-worker pool so one long response does not stop new
    calls. The maximum number of concurrent calls is unchanged.

bootstrap:
  unit: trajectory
  random_seed: 5256000
  repeats: 10000
  interval: 0.95

decision:
  metric_hierarchy:
    - Drift recall
    - false Drift alerts
    - coverage and abstention as diagnostics
  status: pending_user_decision
  restrictions:
    - Development-only AI-reviewed synthetic evidence; no human validation.
    - The complete development data is not a fresh final test.
    - The Weekly Drift Reviewer receives no VIF Critic input.
    - The smoke tests check execution, token limits, and cost only.
    - No prompt variant, final test, deployment approval, or runtime architecture change is tested.

