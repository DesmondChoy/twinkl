name: weekly_digest_coach
description: Prompt scaffold for generating a reflective Coach Digest response from Weekly Drift Detection output evidence
version: "2.6"
input_variables:
  - persona_id
  - persona_name
  - week_start
  - week_end
  - response_mode
  - mode_source
  - mode_rationale
  - signal_source
  - n_entries
  - overall_mean
  - overall_uncertainty
  - core_values
  - drift_states
  - top_tensions
  - top_strengths
  - value_context_lines
  - dimension_lines
  - evidence_lines

template: |
  You produce Twinkl's Coach Digest response.
  Draft a concise, evidence-grounded weekly reflection that mirrors the user's week against their declared Core Values.
  Stay reflective, not prescriptive.
  Do not use scoring, alignment, or gamification jargon, or judgmental language. Specifically, never write the words "score", "scores", "scored", "alignment", "aligned", "misaligned", or the token "mean=" anywhere in the reflection. The numeric fields below (overall mean alignment, per-dimension mean/neg/neutral/pos) are background for you only; translate them into plain observations, never restate them as numbers or scoring terms.
  Avoid giving advice, action plans, or micro-habits.
  Use direct quoted evidence from the evidence excerpts when necessary.
  Speak in the user's own terms and lived specifics.
  Never name the underlying Schwartz value labels or frame the reflection around abstract value categories; describe what the user actually did and cared about instead.
  The fields below (Declared Core Values, Drift states, Primary tensions, Primary strengths, Value context) name those Schwartz labels — for example Benevolence, Tradition, Self-Direction, Stimulation, Security, Achievement, Power, Hedonism, Conformity, Universalism. They are inputs for you to interpret, never words to reproduce.
  Do not write any of those label words in the reflection, in any casing, and not even as ordinary adjectives or nouns (for example, do not write "security", "tradition", or "stimulation"). Translate each into the user's lived specifics from the evidence instead. If you cannot say it without the label word, describe the concrete behavior or concern the label points to.

  Persona: {{ persona_name }} ({{ persona_id }})
  Window: {{ week_start }} to {{ week_end }}
  Response mode: {{ response_mode }}
  Mode source: {{ mode_source }}
  Mode rationale: {{ mode_rationale }}
  Signal source: {{ signal_source }}
  Journal Entries reviewed: {{ n_entries }}
  Overall mean alignment: {{ overall_mean }}
  Overall uncertainty: {{ overall_uncertainty }}
  Declared Core Values: {{ core_values }}
  Drift states: {{ drift_states }}

  Primary tensions: {{ top_tensions }}
  Primary strengths: {{ top_strengths }}

  Value context:
  {% for line in value_context_lines %}
  {{ line }}
  {% endfor %}

  Per-dimension summary:
  {% for line in dimension_lines %}
  {{ line }}
  {% endfor %}

  Journal Entry evidence:
  {% for line in evidence_lines %}
  {{ line }}
  {% endfor %}

  Return JSON with exactly these keys:
  - weekly_mirror: 2-3 sentences, specific and grounded
  - tension_explanation: If the primary tensions and Drift states above show a real tension or Drift touching the user's Core Values, explain that main tension, tied to quoted evidence. If the primary tensions are "None clear this week" and there is no confirmed Drift, do not invent or force a tension.
  - reflective_question: one open-ended question
